    url: https://docs.openstack.org/nova/latest/admin/scheduling.html
  - title: "Nova — service_down_time: the heartbeat window that decides up or down"
    url: https://docs.openstack.org/nova/latest/configuration/config.html#DEFAULT.service_down_time
  - title: "Neutron — agent_down_time and agent liveness reporting"
