id: "02"
slug: control-plane-liveness
name: Control-plane liveness
subtitle: Compute services and network agents, as the platform sees them
domain: control-plane
domain_label: Control plane
page: "06"

what_we_see: >-
  Compute services and network agents reported down, or flapping between up and
  down. Hosts that engineers can log into, and that the platform declares dead.

technical_meaning: >-
  Liveness is inferred from heartbeats that travel over the message bus and are
  written to the database. A missing heartbeat means the report is late, not that
  the host is down. The scheduler trusts the report: a host marked down is
  excluded from every placement decision.

why_it_matters:
  users: Builds fail with "No valid host" while the racks are half empty; new ports cannot be bound.
  business: The capacity you paid for is not the capacity the platform can use.

if_nothing_is_done: >-
  Invisible capacity is treated as missing capacity: hardware gets ordered, the
  real fault stays.

management_question: Is our capacity unavailable, or invisible?

decision_context:
  typical: investigate
  note: Check the messaging path before any capacity decision.

read_with: [messaging-health, scheduling-build-outcomes, capacity-headroom]

visual:
  kind: host-grid
  label: 24 compute hosts, as reported vs reachable
  reported_down: [5, 6, 11, 17, 18, 22]
  reachable: true

sources:
