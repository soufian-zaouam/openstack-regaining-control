id: "05"
slug: scheduling-build-outcomes
name: Scheduling and build outcomes
subtitle: Instance builds that succeed, fail or take too long
domain: control-plane
domain_label: Control plane
page: "08"

what_we_see: >-
  A rising share of builds ending in ERROR. "No valid host was found" in the
  logs. Time to ACTIVE stretching from seconds to minutes. Port-binding failures
  and scheduler retries.

technical_meaning: >-
  Placement and the scheduler could not find a host, or the chosen host could
  not finish the build. Capacity is the cause only sometimes; just as often it
  is a host reported down, a network agent that is not binding ports, or a
  message bus too slow to answer.

why_it_matters:
  users: '"I cannot create a VM" is the most visible failure a platform has.'
  business: >-
    Projects stall, and the wrong diagnosis leads to the most expensive wrong
    decision: buying capacity for a health problem.

if_nothing_is_done: >-
  Delivery stops, workarounds multiply, and trust in the platform erodes with
  every retry.

management_question: Is this a capacity problem, or a health problem?

decision_context:
  typical: investigate
  note: Correlate with liveness and headroom before deciding to buy, reclaim or repair.

read_with: [control-plane-liveness, capacity-headroom, network-health]

visual:
  kind: stacked-outcomes
  label: builds per week, success vs error
  success: [96, 95, 94, 91, 88, 84, 79, 72]
  error: [4, 5, 6, 9, 12, 16, 21, 28]

